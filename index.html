<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soungui Fitness Gym Portal</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FF5733">
<link rel="apple-touch-icon" href="/my-gym-app/logo.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background-color: #121212; color: #ffffff; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .app-container { width: 100%; max-width: 450px; background: #1e1e1e; border-radius: 20px; padding: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.6); margin: auto 0; }
    
    header { text-align: center; margin-bottom: 30px; }
    header h1 { color: #FF5733; font-size: 1.7rem; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 800; }
    header p { color: #888888; font-size: 0.85rem; margin-top: 4px; font-weight: 500; }
    
    .card { background: #262626; border-radius: 16px; padding: 24px; margin-bottom: 20px; border: 1px solid #333333; text-align: center; }
    .card h2 { font-size: 1.15rem; margin-bottom: 16px; color: #ffffff; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
    
    /* Premium Minimalistic Profile Summary Box */
    .profile-pass { background: linear-gradient(135deg, #2d2d2d 0%, #1a1a1a 100%); border: 1px solid #444; border-radius: 14px; padding: 20px; text-align: left; position: relative; overflow: hidden; margin-bottom: 20px; }
    .profile-pass::before { content: ''; position: absolute; top: 0; left: 0; width: 6px; height: 100%; background: #FF5733; }
    .profile-name { font-size: 1.4rem; font-weight: 700; color: #ffffff; margin-bottom: 4px; }
    .profile-email { font-size: 0.9rem; color: #aaaaaa; margin-bottom: 14px; }
    .status-container { display: flex; align-items: center; justify-content: space-between; background: rgba(255, 87, 51, 0.1); padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(255, 87, 51, 0.2); }
    .status-label { font-size: 0.8rem; text-transform: uppercase; color: #FF5733; font-weight: 700; letter-spacing: 0.5px; }
    .status-badge { font-size: 0.9rem; font-weight: 700; color: #00cc66; display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 8px; height: 8px; background-color: #00cc66; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #00cc66; }

    /* Class Roster Elements */
    .class-item { display: flex; justify-content: space-between; align-items: center; background: #2d2d2d; padding: 14px; border-radius: 10px; margin-bottom: 10px; text-align: left; border: 1px solid #383838; }
    .class-info h3 { font-size: 1rem; color: #ffffff; font-weight: 600; margin-bottom: 2px; }
    .class-info p { font-size: 0.8rem; color: #aaaaaa; }
    .book-btn { background: #FF5733; color: #ffffff; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.85rem; }
    .book-btn:disabled { background: #444444; color: #888888; cursor: not-allowed; }

    /* Clean Input Fields Structure (Without Form Element Tags) */
    .form-group { text-align: left; margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.85rem; color: #aaaaaa; margin-bottom: 6px; font-weight: 500; }
    .form-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444444; background: #1e1e1e; color: white; font-size: 1rem; }
    .form-group input:focus { border-color: #FF5733; outline: none; }
    .action-btn { width: 100%; background: #FF5733; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 5px; }
    .logout-btn { width: 100%; background: transparent; color: #888888; border: 1px solid #333333; padding: 10px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; margin-top: 15px; }
  </style>
</head>
<body>
<div class="app-container">
  <header>
    <h1>Soungui Fitness Gym</h1>
    <p>Member Access Portal</p>
  </header>

    <!-- RESTORED: DUAL-ACTION AUTHENTICATION PORTAL (Function Hooks Fixed) -->
  <div class="card" id="auth-card">
    <h2 id="auth-title">Access Member Portal</h2>
    <p id="auth-subtitle" style="color: #aaa; font-size: 0.85rem; margin-bottom: 20px;">
      Enter your credentials to access your profile, book classes, and view your routine.
    </p>
    
    <!-- REGISTRATION ONLY FIELDS (Hidden by default in Login Mode) -->
    <div class="form-group" id="reg-name-group" style="display: none;">
      <label for="user-name">Full Name</label>
      <input type="text" id="user-name" placeholder="John Doe">
    </div>

    <div class="form-group">
      <label for="user-username">Username</label>
      <input type="text" id="user-username" placeholder="johndoe123">
    </div>

    <!-- REGISTRATION ONLY FIELDS (Hidden by default in Login Mode) -->
    <div class="form-group" id="reg-email-group" style="display: none;">
      <label for="user-email">Email Address</label>
      <input type="text" id="user-email" placeholder="john@example.com">
    </div>

    <div class="form-group">
      <label for="user-password">Password</label>
      <input type="password" id="user-password" placeholder="••••••••" style="width: 100%; padding: 10px; border: 1px solid #444; background: #222; color: #fff; border-radius: 6px; box-sizing: border-box;">
    </div>

    <!-- FIXED: Points directly to handleAuthAction() -->
    <button id="activate-profile-btn" class="action-btn" onclick="handleAuthAction()">Enter Portal</button>
    
    <!-- TOGGLE LINK TO SWITCH MODES -->
    <p style="margin-top: 15px; font-size: 0.85rem; color: #ddd; text-align: center;">
      <span id="toggle-text">Don't have an account?</span> 
      <!-- FIXED: Points directly to toggleAuthMode() -->
      <a href="#" id="toggle-auth-btn" onclick="toggleAuthMode(event)" style="color: #4caf50; text-decoration: none; font-weight: bold;">Create an Account</a>
    </p>
  </div>


<script src="js/app.js?v=2"></script>

    </div>

    <button class="logout-btn" onclick="clearProfile()">Switch Profile Account</button>
  </div>

</div>

<script src="js/app.js?v=2"></script>
</body>
</html>
